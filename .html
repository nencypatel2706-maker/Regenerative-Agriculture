<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>AgriN — Regenerative Agricultural Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f8f3;color:#17231a}.glass{background:rgba(255,255,255,.78);backdrop-filter:blur(14px)}.leaf{background:linear-gradient(135deg,#eaf7e9,#f7fbf4)}.chat-scroll{max-height:360px;overflow:auto}.nav-active{background:#e8f5e6;color:#246b35}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API='';
const state={crop:'Cotton',region:'Gujarat',soilPh:6.7,carbon:0.82,rainfall:42,view:'dashboard',messages:[]};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function shell(content){return `<div class="min-h-screen bg-gradient-to-br from-[#f6faf4] via-white to-[#eaf5e8]"><header class="sticky top-0 z-20 border-b border-green-100 glass"><div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-green-700 text-white grid place-items-center text-xl">🌱</div><div><h1 class="font-black text-xl">AgriN</h1><p class="text-xs text-gray-500">Regenerative Agricultural Intelligence</p></div></div><div class="flex gap-2 items-center"><span class="hidden sm:inline text-xs px-3 py-2 rounded-full bg-green-50 text-green-700">● AI system online</span><select id="lang" class="border rounded-xl px-3 py-2 text-sm bg-white"><option>English</option><option>Hindi</option><option>Gujarati</option><option>Marathi</option><option>Tamil</option></select></div></div></header><div class="max-w-7xl mx-auto px-5 py-6 grid lg:grid-cols-[220px_1fr] gap-6"><aside class="space-y-2">${nav('dashboard','⌂','Dashboard')}${nav('advisor','✦','AI Advisor')}${nav('scanner','⌁','Scan Crop')}${nav('regen','♻','Regenerative Plan')}${nav('cooperation','◎','Cooperation Hub')}<div class="mt-7 p-4 rounded-2xl bg-green-900 text-white"><p class="text-xs opacity-70">Farm profile</p><p class="font-bold mt-1">${state.crop}</p><p class="text-sm opacity-80">📍 ${state.region}</p><button onclick="editProfile()" class="mt-3 w-full bg-white/10 rounded-xl py-2 text-sm">Edit profile</button></div></aside><main>${content}</main></div></div>`}
function nav(id,icon,label){return `<button onclick="setView('${id}')" class="w-full text-left px-4 py-3 rounded-xl text-sm font-semibold flex gap-3 ${state.view===id?'nav-active':''}">${icon}<span>${label}</span></button>`}
function setView(v){state.view=v;render()}
function card(title,value,sub,icon){return `<div class="bg-white rounded-3xl p-5 border border-green-100 shadow-sm"><div class="flex justify-between"><span class="text-sm text-gray-500">${title}</span><span class="text-xl">${icon}</span></div><div class="text-2xl font-black mt-3">${value}</div><div class="text-xs text-gray-500 mt-1">${sub}</div></div>`}
function dashboard(){return `<div class="space-y-6"><div class="rounded-[28px] p-7 bg-gradient-to-r from-green-900 to-green-700 text-white"><div class="max-w-3xl"><span class="text-xs uppercase tracking-widest opacity-70">Farmer intelligence</span><h2 class="text-3xl sm:text-4xl font-black mt-2">Good evening. Your farm has a plan.</h2><p class="mt-3 text-green-50/80">AgriN combines crop, soil, weather and AI signals to turn agricultural data into practical regenerative actions.</p><div class="flex flex-wrap gap-3 mt-6"><button onclick="setView('advisor')" class="px-5 py-3 bg-white text-green-900 rounded-xl font-bold">Ask AgriN ✦</button><button onclick="setView('scanner')" class="px-5 py-3 bg-green-800 border border-white/20 rounded-xl font-bold">Scan Crop 📷</button></div></div></div><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${card('Weather','32°C','Partly cloudy · demo data','☀️')}${card('Soil pH',state.soilPh,'Near-neutral · demo data','🧪')}${card('Organic Carbon',state.carbon+'%','Soil health indicator · demo','🌱')}${card('Expected Rainfall',state.rainfall+' mm','Next forecast period · demo','🌧️')}</div><div class="grid lg:grid-cols-3 gap-5"><section class="lg:col-span-2 bg-white rounded-3xl border border-green-100 p-6"><div class="flex justify-between items-center"><div><p class="text-xs uppercase tracking-wider text-green-700 font-bold">Today's advisory</p><h3 class="text-xl font-black mt-1">Build soil resilience before chasing yield</h3></div><span class="px-3 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-bold">Demo intelligence</span></div><div class="grid sm:grid-cols-3 gap-3 mt-5"><div class="p-4 rounded-2xl leaf"><b>💧 Water</b><p class="text-sm text-gray-600 mt-2">Prefer moisture-based irrigation decisions and avoid unnecessary watering before rainfall.</p></div><div class="p-4 rounded-2xl leaf"><b>🌾 Soil</b><p class="text-sm text-gray-600 mt-2">Maintain organic matter and consider suitable cover/rotation practices.</p></div><div class="p-4 rounded-2xl leaf"><b>🐞 Crop</b><p class="text-sm text-gray-600 mt-2">Scout leaves regularly and use integrated pest management principles.</p></div></div></section><section class="bg-white rounded-3xl border border-green-100 p-6"><p class="text-xs uppercase tracking-wider text-green-700 font-bold">Farm context</p><h3 class="text-xl font-black mt-1">${state.crop}</h3><p class="text-sm text-gray-500">📍 ${state.region}</p><div class="mt-5 space-y-3 text-sm"><div class="flex justify-between"><span>Soil status</span><b>Healthy range*</b></div><div class="h-2 bg-gray-100 rounded-full"><div class="h-2 w-[72%] bg-green-600 rounded-full"></div></div><div class="flex justify-between"><span>Water risk</span><b class="text-amber-700">Moderate*</b></div><div class="h-2 bg-gray-100 rounded-full"><div class="h-2 w-[48%] bg-amber-400 rounded-full"></div></div></div><p class="text-[11px] text-gray-400 mt-5">*Prototype indicators. Connect verified field/satellite/weather data for production use.</p></section></div></div>`}
function advisor(){return `<div class="space-y-5"><div><p class="text-xs uppercase tracking-widest text-green-700 font-bold">AI agricultural advisor</p><h2 class="text-3xl font-black">Ask AgriN</h2><p class="text-gray-500">Ask in simple language about your crop and regenerative practices.</p></div><div class="bg-white rounded-3xl border border-green-100 p-5"><div id="chat" class="chat-scroll space-y-3">${state.messages.length?state.messages.map(m=>`<div class="${m.me?'text-right':''}"><div class="inline-block max-w-[90%] rounded-2xl px-4 py-3 ${m.me?'bg-green-700 text-white':'bg-green-50 text-gray-800'} whitespace-pre-wrap text-sm">${esc(m.t)}</div></div>`).join(''):`<div class="text-center py-12 text-gray-400"><div class="text-4xl">🌾</div><p class="mt-3">Try: “How can I improve soil health in my cotton field?”</p></div>`}</div><div class="mt-5 flex gap-2"><input id="q" class="flex-1 border rounded-2xl px-4 py-3 outline-none focus:ring-2 focus:ring-green-200" placeholder="Ask about irrigation, soil, crop health..." onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()" class="px-5 rounded-2xl bg-green-700 text-white font-bold">Ask</button></div></div></div>`}
async function ask(){const q=document.getElementById('q').value.trim();if(!q)return;state.messages.push({me:true,t:q});render();state.messages.push({me:false,t:'AgriN is thinking...'});render();try{const r=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,crop:state.crop,region:state.region})});const d=await r.json();state.messages[state.messages.length-1].t=d.answer||d.detail||'No response.'}catch(e){state.messages[state.messages.length-1].t='Backend is not connected yet. Start FastAPI and make sure GEMINI_API_KEY is configured.'}render()}
function scanner(){return `<div class="space-y-5"><div><p class="text-xs uppercase tracking-widest text-green-700 font-bold">Gemini multimodal</p><h2 class="text-3xl font-black">Scan Crop</h2><p class="text-gray-500">Upload a clear leaf/crop image for AI-assisted assessment.</p></div><div class="grid lg:grid-cols-2 gap-5"><div class="bg-white rounded-3xl border border-green-100 p-7"><label class="border-2 border-dashed border-green-200 rounded-3xl p-10 flex flex-col items-center justify-center cursor-pointer hover:bg-green-50"><div class="text-5xl">📷</div><b class="mt-3">Upload crop image</b><span class="text-sm text-gray-400 mt-1">JPG, PNG or WEBP</span><input id="cropFile" type="file" accept="image/*" class="hidden" onchange="preview(this)"></label><img id="preview" class="hidden mt-4 rounded-2xl max-h-72 mx-auto"/><button onclick="diagnose()" class="w-full mt-4 py-3 rounded-2xl bg-green-700 text-white font-bold">Analyze with AgriN</button></div><div class="bg-white rounded-3xl border border-green-100 p-7"><h3 class="font-black text-lg">AI assessment</h3><div id="diagnosis" class="mt-4 text-sm text-gray-500 whitespace-pre-wrap">Your result will appear here.</div></div></div></div>`}
function preview(input){const img=document.getElementById('preview');if(input.files[0]){img.src=URL.createObjectURL(input.files[0]);img.classList.remove('hidden')}}
async function diagnose(){const f=document.getElementById('cropFile')?.files[0];const out=document.getElementById('diagnosis');if(!f){out.textContent='Please choose an image first.';return}out.textContent='Analyzing image...';const fd=new FormData();fd.append('file',f);fd.append('region',state.region);try{const r=await fetch(API+'/api/diagnose',{method:'POST',body:fd});const d=await r.json();out.textContent=d.advisory||d.detail||'No result.'}catch(e){out.textContent='Backend is not connected. Start FastAPI and configure GEMINI_API_KEY.'}}
function regen(){return `<div class="space-y-5"><div><p class="text-xs uppercase tracking-widest text-green-700 font-bold">Regenerative intelligence</p><h2 class="text-3xl font-black">Regenerative Plan</h2><p class="text-gray-500">Generate a weekly plan using your farm's soil and weather inputs.</p></div><div class="grid lg:grid-cols-[330px_1fr] gap-5"><div class="bg-white rounded-3xl border border-green-100 p-6 space-y-4"><label class="text-sm font-semibold">Crop<select id="crop" class="mt-1 w-full border rounded-xl p-3"><option>Cotton</option><option>Wheat</option><option>Rice</option><option>Groundnut</option><option>Millet</option><option>Vegetables</option></select></label><label class="text-sm font-semibold">Region<input id="region" value="Gujarat" class="mt-1 w-full border rounded-xl p-3"></label><label class="text-sm font-semibold">Soil pH<input id="ph" type="number" step="0.1" value="6.7" class="mt-1 w-full border rounded-xl p-3"></label><label class="text-sm font-semibold">Organic carbon %<input id="carbon" type="number" step="0.01" value="0.82" class="mt-1 w-full border rounded-xl p-3"></label><label class="text-sm font-semibold">Expected rainfall (mm)<input id="rain" type="number" value="42" class="mt-1 w-full border rounded-xl p-3"></label><button onclick="generatePlan()" class="w-full py-3 rounded-xl bg-green-700 text-white font-bold">Generate plan</button></div><div class="bg-white rounded-3xl border border-green-100 p-7"><h3 class="text-xl font-black">Your AI plan</h3><div id="plan" class="mt-4 text-sm text-gray-600 whitespace-pre-wrap">Enter your farm values and generate an advisory.</div></div></div></div>`}
async function generatePlan(){const out=document.getElementById('plan');out.textContent='Generating regenerative plan...';const body={crop:document.getElementById('crop').value,region:document.getElementById('region').value,soil_ph:+document.getElementById('ph').value,carbon_level:+document.getElementById('carbon').value,rainfall:+document.getElementById('rain').value,forecast:'Normal monsoon'};try{const r=await fetch(API+'/api/advisory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();out.textContent=d.regenerative_plan||d.detail||'No plan returned.'}catch(e){out.textContent='Backend is not connected. Start FastAPI and configure GEMINI_API_KEY.'}}
function cooperation(){return `<div class="space-y-5"><div><p class="text-xs uppercase tracking-widest text-green-700 font-bold">Digital public good</p><h2 class="text-3xl font-black">Cooperation Hub</h2><p class="text-gray-500">A prototype view of how states can share agricultural models and knowledge while keeping farmer-facing services localized.</p></div><div class="bg-white rounded-3xl border border-green-100 p-7"><div class="grid md:grid-cols-5 gap-3 items-center text-center"><div class="p-5 rounded-2xl leaf"><b>Gujarat</b><p class="text-xs text-gray-500 mt-1">Crop + soil models</p></div><div class="text-green-600 text-2xl">→</div><div class="p-6 rounded-3xl bg-green-900 text-white"><div class="text-3xl">🌱</div><b>AgriN Network</b><p class="text-xs opacity-70 mt-1">Interoperable intelligence layer</p></div><div class="text-green-600 text-2xl">→</div><div class="p-5 rounded-2xl leaf"><b>Other States</b><p class="text-xs text-gray-500 mt-1">Shared models & insights</p></div></div></div><div class="grid md:grid-cols-3 gap-4">${card('Shared models','12','Prototype registry','🧠')}${card('State nodes','8','Example network','🗺️')}${card('Data standards','Open','Interoperability goal','🔗')}</div></div>`}
function editProfile(){const crop=prompt('Crop',state.crop);const region=prompt('Region',state.region);if(crop)state.crop=crop;if(region)state.region=region;render()}
function render(){let c=state.view==='dashboard'?dashboard():state.view==='advisor'?advisor():state.view==='scanner'?scanner():state.view==='regen'?regen():cooperation();document.getElementById('app').innerHTML=shell(c)}
render();
</script>
</body></html>
